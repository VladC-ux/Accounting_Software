<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StockFlow">
  <defs>
    <linearGradient id="sfGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D6A4F"/>
      <stop offset="1" stop-color="#52B788"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#sfGrad)"/>

  <!-- Area fill under the line -->
  <path d="M28 80 L 50 62 L 68 72 L 92 38 L 92 88 L 28 88 Z"
        fill="#ffffff" fill-opacity="0.18"/>

  <!-- Rising line chart -->
  <path d="M28 80 L 50 62 L 68 72 L 92 38"
        stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Arrow head at the peak -->
  <path d="M78 36 L 94 36 L 94 52"
        stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Data nodes -->
  <circle cx="50" cy="62" r="5" fill="#ffffff"/>
  <circle cx="68" cy="72" r="5" fill="#ffffff"/>
</svg>
